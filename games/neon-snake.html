<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090506">
  <title>Neon Snake — Redline Arcade</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090506;color:#fff7f7;font:15px system-ui,sans-serif;text-align:center;padding:20px;background-image:radial-gradient(ellipse at 50% 0,#12442d55,transparent 55%)}a{color:#ff9da7}.top{max-width:650px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(24px,5vw,38px);margin:18px 0 8px}p{color:#c0aeb1;line-height:1.6}canvas{width:min(88vw,430px);height:min(88vw,430px);max-height:55vh;background:#080506;border:1px solid #ff485866;border-radius:11px;touch-action:none}#status{color:#ff9da7;margin:12px}.controls{max-width:220px;margin:12px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button{border:1px solid #ffffff25;border-radius:8px;background:#241116;color:#fff;padding:10px;font-weight:800;cursor:pointer}.blank{visibility:hidden}
  </style>
</head>
<body>
  <nav class="top"><a href="../index.html">← Back to arcade</a><span>UMGAMEZ? · ORIGINAL GAME</span></nav>
  <h1>Neon Snake</h1><p>Arrow keys or WASD to move. Swipe or use the buttons on touchscreens.</p>
  <div id="status" aria-live="polite">Score: 0</div><canvas id="game" width="400" height="400" aria-label="Neon Snake game board"></canvas>
  <div class="controls" aria-label="Touch controls"><span class="blank"></span><button data-dir="up" aria-label="Move up">▲</button><span class="blank"></span><button data-dir="left" aria-label="Move left">◀</button><button data-dir="down" aria-label="Move down">▼</button><button data-dir="right" aria-label="Move right">▶</button></div>
  <button id="restart" type="button">Restart</button>
  <script>
    (()=>{const c=document.getElementById('game'),x=c.getContext('2d'),status=document.getElementById('status');let snake,dir,food,dead,score,timer;
      function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};food={x:15,y:12};dead=false;score=0;status.textContent='Score: 0';clearInterval(timer);draw();timer=setInterval(step,125)}
      function setDir(d){if(d.x!==-dir.x||d.y!==-dir.y)dir=d}
      document.onkeydown=e=>{const k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(dirs[k]){e.preventDefault();setDir({x:dirs[k][0],y:dirs[k][1]})}};
      document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};setDir(dirs[b.dataset.dir])});
      let touch=null;c.ontouchstart=e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]};c.ontouchend=e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.abs(dx)>Math.abs(dy))setDir({x:Math.sign(dx),y:0});else setDir({x:0,y:Math.sign(dy)});touch=null};document.getElementById('restart').onclick=reset;
      function draw(){x.fillStyle='#080506';x.fillRect(0,0,400,400);x.strokeStyle='#ff334212';for(let i=20;i<400;i+=20){x.beginPath();x.moveTo(i,0);x.lineTo(i,400);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(400,i);x.stroke()}x.fillStyle='#ff3147';x.shadowColor='#ff3147';x.shadowBlur=13;x.fillRect(food.x*20+3,food.y*20+3,14,14);x.shadowBlur=0;x.fillStyle='#ff9da5';snake.forEach(p=>x.fillRect(p.x*20+2,p.y*20+2,16,16));if(dead){x.fillStyle='#fff';x.font='bold 20px system-ui';x.textAlign='center';x.fillText('GAME OVER',200,205)}}
      function step(){if(dead)return;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;status.textContent='Game over — score: '+score+'. Restart to play again.';draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;do{food={x:Math.random()*20|0,y:Math.random()*20|0}}while(snake.some(p=>p.x===food.x&&p.y===food.y));status.textContent='Score: '+score}else snake.pop();draw()}reset();
    })();
  </script>
</body>
</html>
